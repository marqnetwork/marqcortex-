<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MARQ Cortex - AI Readiness Diagnostic Platform" />
    <!--
      An icon, inline.

      There was none, and the absence was not silent: with no `rel="icon"` a
      browser requests `/favicon.ico` by default, so every page load — for every
      user, in dev and in production — logged a 404, and the tab carried the
      blank default mark. A data URI fixes both without adding an asset to
      serve, a build step, or a request.

      The colours are the brand's own tokens: `--cortex-accent` on
      `--cortex-surface-canvas`.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0F'/%3E%3Cpath d='M7 23V9h3.6l5.4 8.2L21.4 9H25v14h-3.4v-8.4L16.8 22h-1.6L10.4 14.6V23H7z' fill='%238B5CF6'/%3E%3C/svg%3E"
    />
    <title>MARQ Cortex - AI Readiness Diagnostic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
